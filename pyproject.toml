[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "turnsafe"
version = "0.1.0"
description = "Validate, repair and trim LLM chat history without orphaning tool calls. Fixes 'tool_use ids were found without tool_result blocks' and 'messages with role tool must be a response to a preceeding message with tool_calls'."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yasir Khan" }]
keywords = [
    "llm",
    "agents",
    "openai",
    "anthropic",
    "claude",
    "tool-calling",
    "function-calling",
    "chat-history",
    "context-window",
    "trim-messages",
    "tool_use",
    "tool_result",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Yasir-Khan-7/turnsafe"
Documentation = "https://github.com/Yasir-Khan-7/turnsafe#readme"
Issues = "https://github.com/Yasir-Khan-7/turnsafe/issues"
Changelog = "https://github.com/Yasir-Khan-7/turnsafe/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE", "AGENT.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/turnsafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls real provider APIs; skipped unless TURNSAFE_LIVE=1"]

[tool.mypy]
strict = true
files = ["src/turnsafe"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
